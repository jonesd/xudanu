name: CodeQL config

paths-ignore:
  - 'original-code/xanadugold/src/**'
  - 'original-code/xanadugold/include/**'
  - 'original-code/xanadugold/src-rust/tests/**'
  - '**/test/**'
  - '**/*.test.*'
  - '**/tests/**'
  - '**/__tests__/**'
  - '**/seed_demo.rs'

query-filters:
  - exclude:
      id: rb/hardcoded-credentials
  - exclude:
      id: cpp/hardcoded-credentials
  - exclude:
      id: js/hardcoded-credentials
  - exclude:
      id: rust/hardcoded-credentials
  - exclude:
      id: js/hardcoded-crypto-key
  - exclude:
      id: cpp/hardcoded-crypto-key
  - exclude:
      id: rust/hardcoded-crypto-key
  - exclude:
      id: js/partially-hardcoded-credentials
  - exclude:
      id: rust/partially-hardcoded-credentials

queries:
  - uses: security-and-quality
