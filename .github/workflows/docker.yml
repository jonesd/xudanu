name: Docker

# Builds and pushes the Xudanu image to GHCR.
# - On release tags (v*): tags :latest, :VERSION, and :stable
# - On main pushes: tags :edge (for early adopters tracking main)
# - Manual dispatch for testing
#
# The image is public: ghcr.io/jonesd/xudanu
# The container registry is free for public repos.

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # v1.7.0 -> 1.7.0, 1.7, latest (on tag pushes)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # main branch -> edge
            type=ref,event=branch
            # stable alias for latest release tag
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Xudanu
            org.opencontainers.image.description=Collaborative hypertext documents with transclusion by reference — working Xanadu
            org.opencontainers.image.source=https://github.com/jonesd/xudanu
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.rel.outputs.is_release == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
