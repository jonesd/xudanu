name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pattern-scan:
    name: Pattern Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Scan for suspicious persistence patterns
        run: ./scripts/pattern-scan.sh --check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt --check
        working-directory: original-code/xanadugold/src-rust

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: original-code/xanadugold/src-rust -> target
      - run: cargo test --features server --lib
        working-directory: original-code/xanadugold/src-rust
      # FR-83 lazy-restore discipline: the same lib suite under the
      # lazy flag — gates are enforced by the debug-assert choke point.
      - run: XUDANU_LAZY_RESTORE=1 cargo test --features server --lib
        working-directory: original-code/xanadugold/src-rust

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: original-code/xanadugold/src-rust -> target
      # The cross-cutting suite CI never ran: HTTP handlers, WS
      # protocol, federation, migration CLI, overlay endpoint. A
      # federation membership regression lived here undetected for
      # weeks because --lib alone was green (Sep 30, 2026).
      # Skip with "[skip integration]" in the commit message.
      - name: Run integration suites
        if: ${{ !contains(github.event.head_commit.message, '[skip integration]') }}
        run: |
          cargo test --features server --test integration --test migration_cli --test recover_cli
        working-directory: original-code/xanadugold/src-rust

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: original-code/xanadugold/src-rust -> target
      - run: cargo clippy --features server -- -W clippy::all -A clippy::large-enum-variant -A clippy::manual-range-contains -A clippy::borrowed-box -A clippy::unnecessary-sort-by -A clippy::indexing_slicing
        working-directory: original-code/xanadugold/src-rust

  # Frontend gate: typecheck + lint + unit tests + build. Before this
  # job, frontend checks ran ONLY in the Release workflow — TS errors
  # shipped to main undetected (Oct 3, 2026: argument-map breakage
  # discovered by the local pre-push hook at v1.17.0 push time, after
  # a day of green CI). The pre-push hook lives in .git/hooks
  # (unversioned) so clones without it had no protection at all.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web/app
      - name: Typecheck
        run: npx tsc -b
        working-directory: web/app
      - name: Lint
        run: npm run lint
        working-directory: web/app
      - name: Unit tests
        run: npm test
        working-directory: web/app
      - name: Build
        run: npm run build
        working-directory: web/app

  # Build-matrix: every configuration the crate promises must compile.
  # The default=[] build broke for ~3 months (May-Aug 2026) because CI
  # only ever built --features server; ungated serde/tracing refs
  # accumulated to 378 errors before anyone noticed. This job is the
  # floor that prevents recurrence (paired with the pre-push
  # cargo-check step for fix-it-on-the-spot).
  build-matrix:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-features
            command: cargo check
          - name: server
            command: cargo check --features server --all-targets
          - name: wasm
            command: cargo check --features wasm --target wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        if: false # placeholder, replaced below
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: original-code/xanadugold/src-rust -> target
      - run: ${{ matrix.command }}
        working-directory: original-code/xanadugold/src-rust
