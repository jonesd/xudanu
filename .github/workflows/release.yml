name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.7.7) — must already exist as a git tag'
        required: true
        type: string
      mac_arm:
        description: 'macOS ARM (Apple Silicon)'
        type: boolean
        default: true
      mac_intel:
        description: 'macOS Intel'
        type: boolean
        default: false
      linux:
        description: 'Linux x86_64'
        type: boolean
        default: false
      linux_arm:
        description: 'Linux ARM64 (experimental)'
        type: boolean
        default: false
      windows:
        description: 'Windows x86_64'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Compute which targets to build based on trigger ──────────────────────
  matrix-prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      tag: ${{ steps.set-matrix.outputs.tag }}
    steps:
      - id: set-matrix
        run: |
          # Tag push → build everything; workflow_dispatch → filter by inputs
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            MATRIX='[
              {"target":"x86_64-unknown-linux-musl","os":"ubuntu-latest","artifact":"xudanu-'"$TAG"'-x86_64-linux-musl.tar.gz","run_test":true},
              {"target":"x86_64-apple-darwin","os":"macos-13","artifact":"xudanu-'"$TAG"'-x86_64-macos.tar.gz","run_test":true},
              {"target":"aarch64-apple-darwin","os":"macos-latest","artifact":"xudanu-'"$TAG"'-aarch64-macos.tar.gz","run_test":true},
              {"target":"aarch64-unknown-linux-gnu","os":"ubuntu-latest","artifact":"xudanu-'"$TAG"'-aarch64-linux-gnu.tar.gz","run_test":false,"continue_on_error":true},
              {"target":"x86_64-pc-windows-msvc","os":"windows-latest","artifact":"xudanu-'"$TAG"'-x86_64-windows.zip","run_test":true}
            ]'
          else
            TAG="${{ inputs.version }}"
            MATRIX="["
            SEP=""
            if [ "${{ inputs.linux }}" = "true" ]; then
              MATRIX+="${SEP}{\"target\":\"x86_64-unknown-linux-musl\",\"os\":\"ubuntu-latest\",\"artifact\":\"xudanu-${TAG}-x86_64-linux-musl.tar.gz\",\"run_test\":true}"
              SEP=","
            fi
            if [ "${{ inputs.mac_intel }}" = "true" ]; then
              MATRIX+="${SEP}{\"target\":\"x86_64-apple-darwin\",\"os\":\"macos-13\",\"artifact\":\"xudanu-${TAG}-x86_64-macos.tar.gz\",\"run_test\":true}"
              SEP=","
            fi
            if [ "${{ inputs.mac_arm }}" = "true" ]; then
              MATRIX+="${SEP}{\"target\":\"aarch64-apple-darwin\",\"os\":\"macos-latest\",\"artifact\":\"xudanu-${TAG}-aarch64-macos.tar.gz\",\"run_test\":true}"
              SEP=","
            fi
            if [ "${{ inputs.linux_arm }}" = "true" ]; then
              MATRIX+="${SEP}{\"target\":\"aarch64-unknown-linux-gnu\",\"os\":\"ubuntu-latest\",\"artifact\":\"xudanu-${TAG}-aarch64-linux-gnu.tar.gz\",\"run_test\":false,\"continue_on_error\":true}"
              SEP=","
            fi
            if [ "${{ inputs.windows }}" = "true" ]; then
              MATRIX+="${SEP}{\"target\":\"x86_64-pc-windows-msvc\",\"os\":\"windows-latest\",\"artifact\":\"xudanu-${TAG}-x86_64-windows.zip\",\"run_test\":true}"
              SEP=","
            fi
            MATRIX+="]"
            if [ "$SEP" = "" ]; then
              echo "No platforms selected, aborting"
              exit 1
            fi
          fi
          {
            echo "matrix<<MATRIX_EOF"
            echo "$MATRIX"
            echo "MATRIX_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ── Frontend unit tests (gate for all builds) ─────────────────────────────
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Run frontend unit tests
        run: |
          cd web/app
          npm ci
          npm test

  # ── Build for each selected target ───────────────────────────────────────
  build:
    needs: [matrix-prep, frontend-tests]
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue_on_error || false }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-prep.outputs.matrix) }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Build React frontend
        run: |
          cd web/app
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install aarch64 cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          # musl.cc mirrors are flaky AND aws-lc-sys hard-requires a
          # musl-named gcc for musl targets. glibc target instead:
          # packaged GNU cross-toolchain, aws-lc happy, no downloads.
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=bfd" >> "$GITHUB_ENV"

      - name: Test
        if: matrix.run_test
        run: cargo test --features server --lib --release --target ${{ matrix.target }} --manifest-path original-code/xanadugold/src-rust/Cargo.toml

      - name: Build
        run: cargo build --release --features server --target ${{ matrix.target }} --manifest-path original-code/xanadugold/src-rust/Cargo.toml

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/xudanu-server dist/
          cp target/${{ matrix.target }}/release/xudanu-cli dist/
          cp target/${{ matrix.target }}/release/migrate_manifest dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/chunk_validator dist/ 2>/dev/null || true
          cp -r web/app/dist dist/
          [ -f LICENSE ] && cp LICENSE dist/ || true
          [ -f NOTICE ] && cp NOTICE dist/ || true
          tar -czf ${{ matrix.artifact }} -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/xudanu-server.exe dist/
          cp target/${{ matrix.target }}/release/xudanu-cli.exe dist/
          cp target/${{ matrix.target }}/release/migrate_manifest.exe dist/
          cp target/${{ matrix.target }}/release/chunk_validator.exe dist/
          cp -r web/app/dist dist/
          if (Test-Path LICENSE) { cp LICENSE dist/ }
          if (Test-Path NOTICE) { cp NOTICE dist/ }
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ matrix.artifact }}

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.matrix-prep.outputs.tag }}
          files: ${{ matrix.artifact }}
          generate_release_notes: true
          body: |
            ## xudanu ${{ needs.matrix-prep.outputs.tag }}

            Conflict-preserving hypertext document store.

            ### Quick Start
            ```bash
            tar -xzf xudanu-${{ needs.matrix-prep.outputs.tag }}-*.tar.gz
            ./xudanu-server run 127.0.0.1:8080 --static-dir dist
            ```
            Then open http://127.0.0.1:8080 in your browser.

            ### Verify
            ```bash
            gh attestation verify xudanu-${{ needs.matrix-prep.outputs.tag }}-*.tar.gz --repo jonesd/xudanu
            ```

            ### Security Warning
            **Do not expose this server directly to the internet.** See README.md for Caddy reverse proxy setup.
