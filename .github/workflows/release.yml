name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue_on_error || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: xudanu-${{ github.ref_name }}-x86_64-linux-musl.tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            artifact: xudanu-${{ github.ref_name }}-x86_64-macos.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: xudanu-${{ github.ref_name }}-aarch64-macos.tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: xudanu-${{ github.ref_name }}-aarch64-linux-musl.tar.gz
            continue_on_error: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: xudanu-${{ github.ref_name }}-x86_64-windows.zip

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build React frontend
        run: |
          cd web/app
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install aarch64 musl cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          wget -q https://musl.cc/aarch64-linux-musl-cross.tgz
          tar xzf aarch64-linux-musl-cross.tgz -C /tmp
          mkdir -p original-code/xanadugold/src-rust/.cargo
          printf '[target.aarch64-unknown-linux-musl]\nlinker = "/tmp/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc"\n' > original-code/xanadugold/src-rust/.cargo/config.toml

      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'x86_64-apple-darwin' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --features server --lib --release --target ${{ matrix.target }} --manifest-path original-code/xanadugold/src-rust/Cargo.toml

      - name: Build
        run: cargo build --release --features server --target ${{ matrix.target }} --manifest-path original-code/xanadugold/src-rust/Cargo.toml

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/xudanu-server dist/
          cp -r web/app/dist dist/
          [ -f LICENSE ] && cp LICENSE dist/ || true
          [ -f NOTICE ] && cp NOTICE dist/ || true
          tar -czf ${{ matrix.artifact }} -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/xudanu-server.exe dist/
          cp -r web/app/dist dist/
          if (Test-Path LICENSE) { cp LICENSE dist/ }
          if (Test-Path NOTICE) { cp NOTICE dist/ }
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.artifact }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
          body: |
            ## xudanu ${{ github.ref_name }}

            Conflict-preserving hypertext document store.

            ### Quick Start
            ```bash
            tar -xzf xudanu-${{ github.ref_name }}-*.tar.gz
            ./xudanu-server run 127.0.0.1:8080 --static-dir dist
            ```
            Then open http://127.0.0.1:8080 in your browser.

            ### Verify
            ```bash
            gh attestation verify xudanu-${{ github.ref_name }}-*.tar.gz --repo jonesd/xudanu
            ```

            ### Security Warning
            **Do not expose this server directly to the internet.** See README.md for Caddy reverse proxy setup.
