sonar.projectKey=xudanu-src-rust
sonar.projectName=xudanu-src-rust
sonar.projectVersion=0.7.9

sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.rs

sonar.exclusions=target/**,data/**,data.bak/**,data.bak2/**,data.old/**,pkg/**,--help/**,--data-dir/**

# Import Rust diagnostics from Clippy JSON generated by scripts/security-checks.sh sonar-prep
sonar.rust.clippy.reportPaths=target/sonar/clippy.json