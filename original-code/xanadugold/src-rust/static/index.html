<!DOCTYPE html>
<html>
<head>
<title>xudanu</title>
<style>
body { font-family: monospace; max-width: 80em; margin: 2em auto; background: #1a1a2e; color: #e0e0e0; }
h1 { color: #e94560; }
#log { background: #16213e; border: 1px solid #0f3460; padding: 1em; height: 30em; overflow-y: auto; white-space: pre-wrap; font-size: 13px; }
#input { display: flex; gap: 0.5em; margin-top: 1em; }
#cmd { flex: 1; background: #16213e; color: #e0e0e0; border: 1px solid #0f3460; padding: 0.5em; font-family: monospace; font-size: 14px; }
button { background: #e94560; color: white; border: none; padding: 0.5em 1.5em; cursor: pointer; font-family: monospace; }
button:hover { background: #c73e54; }
.prompt { color: #e94560; }
.error { color: #ff6b6b; }
.info { color: #4ecdc4; }
</style>
</head>
<body>
<h1>xudanu</h1>
<div id="status">Not connected</div>
<div id="log"></div>
<div id="input">
<input id="cmd" placeholder="Type a command... (help for list)" autofocus />
<button onclick="sendCmd()">Send</button>
<button onclick="connectWs()">Connect</button>
</div>
<script>
let ws = null;
let nextId = 1;
let sessionId = null;
let loggedIn = false;
const log = document.getElementById('log');
const cmd = document.getElementById('cmd');
const status = document.getElementById('status');

function append(text, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/xudanu?format=json&version=2');
  ws.onopen = () => { status.textContent = 'Connected'; append('Connected to server.', 'info'); };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'handshake') {
      append('Handshake: server v' + msg.payload.server_version + ' capabilities: ' + msg.payload.server_capabilities.join(', '), 'info');
      doConnect();
    } else if (msg.type === 'response') {
      handleResponse(msg);
    } else if (msg.type === 'error') {
      append('Error: ' + (msg.message || msg.code || JSON.stringify(msg)), 'error');
    } else if (msg.type === 'event') {
      append('Event: ' + JSON.stringify(msg.event), 'info');
    } else {
      append(JSON.stringify(msg, null, 2));
    }
  };
  ws.onclose = () => { status.textContent = 'Disconnected'; append('Disconnected.', 'error'); };
  ws.onerror = () => { append('Connection error.', 'error'); };
}

function sendReq(op, payload) {
  const id = nextId++;
  const frame = {v:2, type:'request', id, op};
  if (payload) frame.payload = payload;
  ws.send(JSON.stringify(frame));
  return id;
}

function doConnect() {
  sendReq('session_connect');
}

function handleResponse(msg) {
  const v = msg.value;
  if (v && v.value !== undefined && typeof v.value === 'number' && !sessionId) {
    sessionId = v.value;
    append('Session: ' + sessionId, 'info');
    sendReq('session_login_public');
    return;
  }
  if (!loggedIn && sessionId) {
    loggedIn = true;
    append('Logged in.', 'info');
    append('Type commands like: create-work hello, list-works, grab 42, revise 42 new text, create-link 42 43', 'info');
    return;
  }
  append(formatValue(v));
}

function formatValue(v) {
  if (!v) return '';
  if (v.type === 'edition') {
    return formatEdition(v.value);
  }
  if (v.type === 'work_list') {
    return formatWorkList(v.value);
  }
  if (v.type === 'link_list') {
    return formatLinkList(v.value);
  }
  if (v.type === 'club_names') {
    return formatTable(v.value.map(p => [p[0], p[1]]));
  }
  return JSON.stringify(v, null, 2);
}

function formatEdition(ed) {
  if (!ed) return '(empty)';
  if (ed.text) return ed.text;
  if (ed.entries) {
    return ed.entries.map(e => {
      const elem = e[1];
      if (elem.Text) return elem.Text.text || '';
      return '[' + JSON.stringify(elem) + ']';
    }).join('');
  }
  return JSON.stringify(ed);
}

function formatWorkList(entries) {
  if (!entries || entries.length === 0) return 'No works.';
  let s = pad('ID',8) + pad('OWNER',8) + pad('REVS',6) + 'GRABBED\n';
  for (const e of entries) {
    s += pad(e.work_id,8) + pad(e.owner||0,8) + pad(e.revision_count,6) + (e.is_grabbed?'yes':'no') + '\n';
  }
  return s;
}

function formatLinkList(links) {
  if (!links || links.length === 0) return 'No links.';
  let s = pad('LINK',8) + pad('FROM',8) + 'TO\n';
  for (const l of links) {
    s += pad(l.link_id,8) + pad(l.origin,8) + l.destination + '\n';
  }
  return s;
}

function formatTable(rows) {
  return rows.map(r => r.join('\t')).join('\n');
}

function pad(s, n) {
  s = String(s);
  while (s.length < n) s += ' ';
  return s;
}

function sendCmd() {
  const text = cmd.value.trim();
  if (!text) return;
  cmd.value = '';
  append('> ' + text, 'prompt');
  const parts = text.split(/\s+/);
  const c = parts[0].toLowerCase();
  const a = parts.slice(1);
  switch(c) {
    case 'create-work': sendReq('work_create', {edition: {text: a.join(' ') || 'empty'}}); break;
    case 'get-work': sendReq('work_get_edition', {work_id: +a[0]}); break;
    case 'list-works': sendReq('work_list'); break;
    case 'grab': sendReq('work_grab', {work_id: +a[0]}); break;
    case 'revise': sendReq('work_revise', {work_id: +a[0], edition: {text: a.slice(1).join(' ') || ''}}); break;
    case 'release': sendReq('work_release', {work_id: +a[0]}); break;
    case 'history': sendReq('work_revision_count', {work_id: +a[0]}); break;
    case 'create-link': sendReq('link_create', {origin: +a[0], destination: +a[1]}); break;
    case 'get-link': sendReq('link_get', {link_id: +a[0]}); break;
    case 'list-links': sendReq('link_list_for_work', {work_id: +a[0]}); break;
    case 'delete-link': sendReq('link_delete', {link_id: +a[0]}); break;
    case 'find-content': sendReq('find_works_for_content', {content_be_id: +a[0]}); break;
    case 'club-create': if (a[0]) sendReq('club_create_named', {name: a[0], description: 'empty'}); else sendReq('club_create', {description: 'empty'}); break;
    case 'club-list': sendReq('club_names'); break;
    case 'info': sendReq('server_stats'); break;
    case 'help': append('Commands: create-work <text>, get-work <id>, list-works, grab <id>, revise <id> <text>, release <id>, history <id>, create-link <origin> <dest>, get-link <id>, list-links <work-id>, delete-link <id>, find-content <be-id>, club-create [name], club-list, info', 'info'); break;
    default: append('Unknown: ' + c + '. Type help.', 'error');
  }
}

cmd.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendCmd(); });
connectWs();
</script>
</body>
</html>
