<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root {
  --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --bg4:#30363d;
  --fg:#c9d1d9; --fg2:#8b949e; --fg3:#484f58;
  --accent:#58a6ff; --green:#3fb950; --red:#f85149;
  --orange:#d29922; --purple:#bc8cff;
  --border:#30363d; --radius:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column}
#app{display:flex;flex-direction:column;flex:1;min-height:0}
a{color:var(--accent)}

header{background:var(--bg2);padding:4px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0;height:32px}
header .logo{font-weight:700;font-size:15px;color:var(--accent);letter-spacing:-0.5px}
header .status{font-size:12px;color:var(--fg2)}
header .status.connected{color:var(--green)}
header .spacer{flex:1}
header .session-info{font-size:11px;color:var(--fg2);background:var(--bg3);padding:3px 8px;border-radius:var(--radius)}

.layout{display:flex;flex:1;overflow:hidden;min-height:0}

.sidebar{width:200px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:12px 12px 8px;display:flex;align-items:center;justify-content:space-between}
.sidebar-header h2{font-size:11px;color:var(--fg2);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.sidebar-header button{background:var(--accent);color:var(--bg);border:none;padding:4px 10px;border-radius:var(--radius);cursor:pointer;font-size:12px;font-weight:600}
.sidebar-header button:hover{opacity:.85}
.sidebar-header button:disabled{opacity:.35;cursor:default}
.work-list{flex:1;overflow-y:auto}
.work-item{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--bg3);display:flex;align-items:center;gap:8px}
.work-item:hover{background:var(--bg3)}
.work-item.active{background:var(--bg3);border-left:2px solid var(--accent)}
.work-item .id{font-size:10px;color:var(--fg3);font-family:'SF Mono',Menlo,monospace}
.work-item .meta{font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.work-item .rev{font-size:10px;color:var(--fg3)}
.work-item .badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600}
.badge-editing{background:var(--orange);color:var(--bg)}

.center{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}

.toolbar{background:var(--bg2);padding:6px 12px;display:flex;gap:6px;border-bottom:1px solid var(--border);align-items:center;flex-shrink:0}
.toolbar button{background:var(--bg3);color:var(--fg);border:none;padding:5px 12px;border-radius:var(--radius);cursor:pointer;font-size:12px;font-family:inherit}
.toolbar button:hover{background:var(--bg4)}
.toolbar button:disabled{opacity:.35;cursor:default}
.toolbar button.primary{background:var(--green);color:var(--bg);font-weight:600}
.toolbar button.primary:hover{opacity:.85}
.toolbar button.danger{background:var(--red);color:#fff}
.toolbar button.danger:hover{opacity:.85}
.toolbar .sep{width:1px;height:20px;background:var(--bg4);margin:0 4px}
.toolbar .rev-info{font-size:11px;color:var(--fg2);font-family:'SF Mono',Menlo,monospace;margin-left:auto}
.toolbar .rev-info .editing{color:var(--orange);font-weight:600}

.revision-slider{background:var(--bg2);padding:6px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.revision-slider label{font-size:11px;color:var(--fg2);white-space:nowrap}
.revision-slider input[type=range]{flex:1;accent-color:var(--accent)}
.revision-slider .rev-num{font-size:11px;color:var(--accent);font-family:'SF Mono',Menlo,monospace;min-width:50px;text-align:right}
.revision-slider button{background:var(--bg3);color:var(--fg);border:none;padding:3px 8px;border-radius:var(--radius);cursor:pointer;font-size:11px}
.revision-slider button.restore-btn{background:var(--orange);color:var(--bg);font-weight:600;margin-left:4px}

.editor-area{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;min-height:0}
.editor-area.split{display:flex;overflow:hidden}
.editor-pane-wrap{flex:1;overflow-y:auto;position:relative;min-height:0}
.editor-content{padding:16px 32px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;outline:none}
.editor-content:empty::before{content:'Select or create a document...';color:var(--fg3)}
.editor-content[contenteditable=true]{background:rgba(88,166,255,0.03)}
.placeholder-text{color:var(--fg3);font-style:italic}
.doc-image{max-width:100%;border-radius:var(--radius);margin:8px 0;display:block;border:1px solid var(--border)}
.doc-image-link{color:var(--accent);font-size:12px;font-family:'SF Mono',Menlo,monospace;cursor:pointer}
.doc-image-link:hover{text-decoration:underline}
.img-upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:16px;text-align:center;color:var(--fg2);font-size:12px;cursor:pointer;margin:8px 0}
.img-upload-zone:hover{border-color:var(--accent);color:var(--accent)}
.img-upload-zone.dragover{border-color:var(--green);background:rgba(63,185,80,0.08)}
.img-drop-overlay{position:absolute;inset:0;background:rgba(88,166,255,0.08);border:2px dashed var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:16px;font-weight:600;z-index:30;pointer-events:none;border-radius:4px}
.doc-image.selected{outline:2px solid var(--accent);outline-offset:2px}
.overlay-panel{position:absolute;right:12px;top:12px;width:220px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;z-index:40;box-shadow:0 4px 16px rgba(0,0,0,0.5)}
.overlay-panel h3{font-size:12px;color:var(--fg2);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
.overlay-panel .ctrl{margin-bottom:8px}
.overlay-panel .ctrl label{display:block;font-size:11px;color:var(--fg2);margin-bottom:3px}
.overlay-panel .ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.overlay-panel .ctrl .val{font-size:10px;color:var(--accent);font-family:'SF Mono',Menlo,monospace;float:right}
.overlay-panel .ctrl-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.overlay-panel .ctrl-row button{background:var(--bg3);color:var(--fg);border:none;padding:4px 8px;border-radius:3px;cursor:pointer;font-size:11px}
.overlay-panel .ctrl-row button:hover{background:var(--bg4)}
.overlay-panel .ctrl-row button.active{background:var(--accent);color:var(--bg)}
.overlay-panel .apply-btn{width:100%;background:var(--green);color:var(--bg);border:none;padding:6px;border-radius:var(--radius);cursor:pointer;font-size:12px;font-weight:600;margin-top:4px}
.overlay-panel .apply-btn:hover{opacity:.85}
.overlay-panel .close-btn{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--fg3);cursor:pointer;font-size:14px;padding:2px}
.overlay-panel .close-btn:hover{color:var(--fg)}
.overlay-panel .preview-img{width:100%;border-radius:4px;margin-bottom:8px;border:1px solid var(--border)}

.editor-divider{width:40px;min-width:40px;background:var(--bg2);position:relative;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--border);border-right:1px solid var(--border)}
.editor-divider::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--border)}

.split-close{position:absolute;top:8px;right:8px;background:var(--bg3);color:var(--fg);border:none;padding:4px 8px;border-radius:var(--radius);cursor:pointer;font-size:11px;z-index:20}
.split-close:hover{background:var(--bg4)}
.split-label{position:absolute;top:8px;left:12px;font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:1px;z-index:20;background:var(--bg2);padding:2px 6px;border-radius:3px}

.transclusion-hl{background:rgba(210,153,34,0.25);border-bottom:2px solid var(--orange);border-radius:2px}

.svg-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:15;overflow:visible}

.find-refs-popup{position:fixed;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,0.4);min-width:220px;max-width:320px;transform:translateX(-50%)}
.find-refs-popup .fr-btn{background:var(--orange);color:var(--bg);border:none;padding:4px 12px;border-radius:var(--radius);cursor:pointer;font-size:12px;font-weight:600;width:100%}
.find-refs-popup .fr-btn:hover{opacity:.85}
.find-refs-popup .fr-btn:disabled{opacity:.5;cursor:default}
.find-refs-popup .fr-loading{font-size:11px;color:var(--fg2);margin-top:6px;text-align:center}
.find-refs-results{margin-top:6px;max-height:200px;overflow-y:auto}
.find-refs-result{padding:5px 8px;cursor:pointer;font-size:11px;border-radius:3px;display:flex;align-items:center;gap:6px}
.find-refs-result:hover{background:var(--bg3)}
.find-refs-result .fr-id{font-family:'SF Mono',Menlo,monospace;color:var(--accent);min-width:30px}
.find-refs-result .fr-owner{color:var(--fg2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.find-refs-result .fr-count{background:var(--orange);color:var(--bg);padding:1px 6px;border-radius:3px;font-size:9px;font-weight:600}

.footer{background:var(--bg2);border-top:1px solid var(--border);padding:3px 12px;display:none;gap:8px;flex-shrink:0}
.footer.visible{display:flex}
.footer input{flex:1;background:var(--bg);color:var(--fg);border:1px solid var(--border);padding:4px 10px;border-radius:var(--radius);font-family:'SF Mono',Menlo,monospace;font-size:12px}
.footer input:focus{border-color:var(--accent);outline:none}
.footer button{background:var(--bg4);color:var(--fg);border:none;padding:4px 14px;border-radius:var(--radius);cursor:pointer;font-size:12px}

.toast-wrap{position:fixed;bottom:50px;right:16px;z-index:100;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--bg3);color:var(--fg);padding:8px 16px;border-radius:var(--radius);font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

@media(max-width:900px){.sidebar{width:180px}}
@media(max-width:700px){.sidebar{display:none}}
</style>

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function computeDelta(oldText, newText) {
  var ops = [], oi = 0, ni = 0, ol = oldText.length, nl = newText.length;
  while (oi < ol || ni < nl) {
    var cl = 0, mx = Math.min(ol - oi, nl - ni);
    while (cl < mx && oldText.charCodeAt(oi + cl) === newText.charCodeAt(ni + cl)) cl++;
    if (cl > 0) { ops.push({type:'retain',count:cl}); oi += cl; ni += cl; }
    var dl = 0;
    while (oi + dl < ol && (ni >= nl || oldText.charCodeAt(oi + dl) !== newText.charCodeAt(ni))) dl++;
    if (dl > 0) { ops.push({type:'delete',count:dl}); oi += dl; }
    var il = 0;
    while (ni + il < nl && (oi >= ol || oldText.charCodeAt(oi) !== newText.charCodeAt(ni + il))) il++;
    if (il > 0) { ops.push({type:'insert',text:newText.substring(ni,ni+il)}); ni += il; }
  }
  return ops;
}

function highlightRegions(text, regions, cls) {
  if (!regions || !regions.length) return escapeHtml(text);
  var sorted = regions.slice().sort(function(a,b){return a.start - b.start});
  var html = '', pos = 0;
  for (var i = 0; i < sorted.length; i++) {
    var r = sorted[i];
    if (r.start > pos) html += escapeHtml(text.slice(pos, r.start));
    html += '<span class="' + cls + '" data-idx="' + i + '">';
    html += escapeHtml(text.slice(r.start, r.end));
    html += '</span>';
    pos = r.end;
  }
  if (pos < text.length) html += escapeHtml(text.slice(pos));
  return html;
}

function editionText(ed) {
  if (!ed || ed.empty !== undefined) return '';
  if (ed.text) return ed.text;
  if (ed.entries) return ed.entries.map(function(e){
    var el = e[1]; return el.Text ? el.Text.text : '[' + JSON.stringify(el) + ']';
  }).join('');
  return JSON.stringify(ed);
}

function renderImageMarkers(html, selectedHash) {
  return html.replace(/\[img:([0-9a-f]{16}):([a-zA-Z0-9/+-]+)\]/g, function(m, hash, mime) {
    var src = '/blobs/' + hash;
    var selCls = (hash === selectedHash) ? ' selected' : '';
    if (mime.indexOf('image/') === 0) {
      return '<img class="doc-image' + selCls + '" src="' + src + '" alt="blob:' + hash + '" loading="lazy" data-blob-hash="' + hash + '">';
    }
    return '<a class="doc-image-link" href="' + src + '" target="_blank">Attachment ' + hash + ' (' + mime + ')</a>';
  });
}

function renderContent(text, selectedHash) {
  return renderImageMarkers(escapeHtml(text), selectedHash || null);
}

   function blobUpload(wsRef, req, currentWorkId, currentRev, lastSavedRef, toast) {
     var input = document.createElement('input');
     input.type = 'file';
     input.accept = 'image/*,.pdf,.txt';
     input.onchange = function() {
       var file = input.files[0];
       if (!file) return;
       var reader = new FileReader();
       reader.onload = function() {
        var bytes = new Uint8Array(reader.result);
        var binary = '';
        for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        var b64 = btoa(binary);
        window._pendingBlobMeta = {mime: file.type, name: file.name, currentWorkId: currentWorkId, lastSavedRef: lastSavedRef};
        req('blob_upload', {data: b64, mime_type: file.type});
       };
       reader.readAsArrayBuffer(file);
     };
     input.click();
   }

  function opsToCssFilter(ops) {
    var parts = [], opacity = null, rotate = null, flipH = false, flipV = false, w = null, h = null;
    ops.forEach(function(op) {
      if (op.Brightness !== undefined) parts.push('brightness(' + (op.Brightness / 1000) + ')');
      else if (op.Contrast !== undefined) parts.push('contrast(' + (op.Contrast / 1000) + ')');
      else if (op.Grayscale !== undefined) parts.push('grayscale(1)');
      else if (op.Opacity !== undefined) opacity = op.Opacity / 1000;
      else if (op.Rotate !== undefined) rotate = op.Rotate;
      else if (op.FlipHorizontal !== undefined) flipH = true;
      else if (op.FlipVertical !== undefined) flipV = true;
      else if (op.Resize) { w = op.Resize.width; h = op.Resize.height; }
    });
    var style = {};
    if (parts.length) style.filter = parts.join(' ');
    if (opacity !== null) style.opacity = opacity;
    var transforms = [];
    if (rotate) transforms.push('rotate(' + rotate + 'deg)');
    if (flipH) transforms.push('scaleX(-1)');
    if (flipV) transforms.push('scaleY(-1)');
    if (transforms.length) style.transform = transforms.join(' ');
    if (w) style.maxWidth = w + 'px';
    if (h) style.maxHeight = h + 'px';
    return style;
  }

var toastId = 0;

function App() {
  var _status = useState('connecting'), status = _status[0], setStatus = _status[1];

  function toast(msg) {
    var id = ++toastId;
    setToasts(function(prev) { return prev.concat({id:id, msg:msg, show:false}); });
    setTimeout(function(){
      setToasts(function(prev){return prev.map(function(t){return t.id===id?{id:t.id,msg:t.msg,show:true}:t})});

        if (v && v.type === 'blob_meta' && op === 'blob_upload') {
          var meta = v.value;
          var hashHex = ('0000000000000000' + meta.content_hash.toString(16)).slice(-16);
          var marker = '\n[img:' + hashHex + ':' + meta.mime_type + ']\n';

            var ed = editorRef.current;

              if (sel.rangeCount) {
                var range = sel.getRangeAt(0);

            toast('Image uploaded: ' + (pending.name || hashHex));

          return;

          var meta = v.value;

          var pending = window._pendingOverlayApply;

              req('work_revise', {work_id:currentWorkId, edition:{text:historyTextRef.current||''}});
              restoringRef.current = 'revising';
            } else {
              setIsEditing(true);
              toast('Editing - type your changes');
            }
          }
          return;
        }

        if (v && v.type === 'humber') {
          if (op === 'work_revise') {
            var rv = v.value;
            setCurrentRev(rv);
            setTotalRevs(rv);
            if (restoringRef.current === 'revising') {

              req('work_release', {work_id:currentWorkId});

          if (op === 'work_revise_delta') {
            setCurrentRev(v.value);
            setTotalRevs(v.value);
            toast('Auto-saved revision ' + v.value);
            return;
          }
          if (op === 'work_revision_count') {

        }

        if (op === 'work_grab') {

              restoringRef.current = false;

        var cx1 = lx + (rx - lx) * 0.4;

                  fill: 'none',
                  stroke: '#d29922',
                  'stroke-width': 2,
                  opacity: 0.7,
                  'stroke-dasharray': '4,2'
                });
              })
            )
          ) : h(Fragment, null,
            showHistory && historyViewText !== null
              ? h('div', {
                  className: 'editor-content',
                  style: {opacity: 0.6},
                  dangerouslySetInnerHTML: {__html: renderContent(historyViewText)}
                })
              : isEditing
                ? h('div', {
                    ref: editorRef,
                    className: 'editor-content',
                    onInput: handleEditorInput,
                    onMouseUp: handleSelectionCheck
                  })
                : h('div', {
                    ref: editorRef,
                    className: 'editor-content',
                    onMouseUp: handleSelectionCheck,
                    dangerouslySetInnerHTML: {__html: renderContent(currentText, selectedImg)}
                  }),
            showFindRefs && currentWorkId ? h('div', {
              className: 'find-refs-popup',
              style: {left: findRefsPos.x + 'px', top: findRefsPos.y + 'px'}
            },
              h('button', {
                className: 'fr-btn',
                onClick: findReferences,
                disabled: findRefsLoading
              }, findRefsLoading ? 'Searching...' : 'Find references'),
              transclusionResults.length > 0 ? h('div', {className:'find-refs-results'},
                transclusionResults.map(function(r, i){
                  return h('div', {
                    key: i,
                    className: 'find-refs-result',
                    onClick: function(){ openSplitView(r.work_id); }
                  },
                    h('span', {className:'fr-id'}, r.work_id),
                    h('span', {className:'fr-owner'}, r.owner || 'unknown'),
                    h('span', {
                      className:'fr-count',
                      title: (r.matches || []).map(function(m,i){
                        return '"' + selectedText + '" at ' + m.start + '-' + m.end;
                      }).join('\n')
                    }, r.matches ? r.matches.length : 0)
                  );
                })
              ) : null
            ) : null
          )
        )
      )
    ),
    h('div', {className:'footer' + (showFooter ? ' visible' : '')},
      h('input', {
        value: cmdText,
        onInput: function(e){ setCmdText(e.target.value); },
        onKeyDown: function(e){ if(e.key==='Enter') sendCmd(); },
        placeholder: 'Type "help" for commands... (Esc to close)'
      }),
      h('button', {onClick:sendCmd}, 'Run')
    ),
    h('div', {className:'toast-wrap'},
      toasts.map(function(t){
        return h('div', {key:t.id, className:'toast' + (t.show?' show':'')}, t.msg);
      })
    )
  );
}

render(h(App), document.getElementById('app'));
</script>
</body>
</html>
