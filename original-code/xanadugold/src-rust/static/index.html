<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xudanu</title>
<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --bg4: #30363d;
  --fg: #e6edf3; --fg2: #8b949e; --fg3: #484f58;
  --accent: #58a6ff; --green: #3fb950; --red: #f85149; --orange: #d29922;
  --purple: #bc8cff; --cyan: #39d353;
  --radius: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; }
a { color: var(--accent); }

header { background: var(--bg2); padding: 8px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--bg3); flex-shrink: 0; }
header .logo { font-weight: 700; font-size: 15px; color: var(--accent); letter-spacing: -0.5px; }
header .status { font-size: 12px; color: var(--fg2); }
header .status.connected { color: var(--green); }
header .spacer { flex: 1; }
header .session-info { font-size: 11px; color: var(--fg2); background: var(--bg3); padding: 3px 8px; border-radius: var(--radius); }

.layout { display: flex; flex: 1; overflow: hidden; }

.sidebar { width: 240px; background: var(--bg2); border-right: 1px solid var(--bg3); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 12px 12px 8px; display: flex; align-items: center; justify-content: space-between; }
.sidebar-header h2 { font-size: 11px; color: var(--fg2); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.sidebar-header button { background: var(--accent); color: var(--bg); border: none; padding: 4px 10px; border-radius: var(--radius); cursor: pointer; font-size: 12px; font-weight: 600; }
.sidebar-header button:hover { opacity: 0.85; }
.work-list { flex: 1; overflow-y: auto; }
.work-item { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--bg3); display: flex; align-items: center; gap: 8px; }
.work-item:hover { background: var(--bg3); }
.work-item.active { background: var(--bg3); border-left: 2px solid var(--accent); }
.work-item .id { font-size: 10px; color: var(--fg3); font-family: 'SF Mono', Menlo, monospace; }
.work-item .meta { font-size: 12px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.work-item .rev { font-size: 10px; color: var(--fg3); }
.work-item .badge { font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: 600; }
.badge-editing { background: var(--orange); color: var(--bg); }
.badge-locked { background: var(--red); color: white; }

.center { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.toolbar { background: var(--bg2); padding: 6px 12px; display: flex; gap: 6px; border-bottom: 1px solid var(--bg3); align-items: center; flex-shrink: 0; }
.toolbar button { background: var(--bg3); color: var(--fg); border: none; padding: 5px 12px; border-radius: var(--radius); cursor: pointer; font-size: 12px; font-family: inherit; }
.toolbar button:hover { background: var(--bg4); }
.toolbar button:disabled { opacity: 0.35; cursor: default; }
.toolbar button.primary { background: var(--green); color: var(--bg); font-weight: 600; }
.toolbar button.primary:hover { opacity: 0.85; }
.toolbar button.danger { background: var(--red); color: white; }
.toolbar .sep { width: 1px; height: 20px; background: var(--bg4); margin: 0 4px; }
.toolbar .rev-info { font-size: 11px; color: var(--fg2); font-family: 'SF Mono', Menlo, monospace; margin-left: auto; }
.toolbar .rev-info .editing { color: var(--orange); font-weight: 600; }
.toolbar .rev-info .saving { color: var(--accent); }

.presence-bar { background: var(--bg2); padding: 4px 12px; border-bottom: 1px solid var(--bg3); display: flex; gap: 8px; align-items: center; flex-shrink: 0; min-height: 28px; }
.presence-bar .label { font-size: 10px; color: var(--fg3); text-transform: uppercase; }
.presence-user { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }

.revision-slider { background: var(--bg2); padding: 6px 12px; border-bottom: 1px solid var(--bg3); display: none; align-items: center; gap: 8px; flex-shrink: 0; }
.revision-slider.visible { display: flex; }
.revision-slider label { font-size: 11px; color: var(--fg2); white-space: nowrap; }
.revision-slider input[type=range] { flex: 1; accent-color: var(--accent); }
.revision-slider .rev-num { font-size: 11px; color: var(--accent); font-family: 'SF Mono', Menlo, monospace; min-width: 50px; text-align: right; }
.revision-slider button { background: var(--bg3); color: var(--fg); border: none; padding: 3px 8px; border-radius: var(--radius); cursor: pointer; font-size: 11px; }

.editor-area { flex: 1; overflow-y: auto; position: relative; }
.editor-content { padding: 20px 24px; font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; min-height: 100%; outline: none; }
.editor-content:empty::before { content: 'Select or create a document...'; color: var(--fg3); }
.editor-content[contenteditable=true] { background: var(--bg); }
.placeholder-text { color: var(--fg3); font-style: italic; }

.right-panel { width: 260px; background: var(--bg2); border-left: 1px solid var(--bg3); display: flex; flex-direction: column; flex-shrink: 0; }
.right-panel .panel-header { padding: 12px 12px 8px; }
.right-panel h2 { font-size: 11px; color: var(--fg2); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.link-list { flex: 1; overflow-y: auto; }
.link-item { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--bg3); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.link-item:hover { background: var(--bg3); }
.link-item .arrow { color: var(--accent); }
.link-item .id { font-size: 10px; color: var(--fg3); font-family: 'SF Mono', Menlo, monospace; }

.footer { background: var(--bg2); border-top: 1px solid var(--bg3); padding: 6px 12px; display: flex; gap: 8px; flex-shrink: 0; }
#cmd { flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--bg4); padding: 6px 10px; border-radius: var(--radius); font-family: 'SF Mono', Menlo, monospace; font-size: 12px; }
#cmd:focus { border-color: var(--accent); outline: none; }
.footer button { background: var(--bg4); color: var(--fg); border: none; padding: 6px 14px; border-radius: var(--radius); cursor: pointer; font-family: inherit; font-size: 12px; }

.toast { position: fixed; bottom: 50px; right: 16px; background: var(--bg3); color: var(--fg); padding: 8px 16px; border-radius: var(--radius); font-size: 12px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
.toast.show { opacity: 1; }

.color-legend { padding: 12px; border-top: 1px solid var(--bg3); }
.color-legend h3 { font-size: 10px; color: var(--fg3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; margin-bottom: 3px; }
.legend-swatch { width: 12px; height: 12px; border-radius: 2px; }

@media (max-width: 900px) {
  .sidebar { width: 180px; }
  .right-panel { width: 200px; }
}
@media (max-width: 700px) {
  .sidebar, .right-panel { display: none; }
}
</style>
</head>
<body>
<header>
  <span class="logo">xudanu</span>
  <span class="status" id="status">connecting...</span>
  <span class="spacer"></span>
  <span class="session-info" id="sessionInfo"></span>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Documents</h2>
      <button id="btnNew" onclick="doCreate()" disabled>+ New</button>
    </div>
    <div class="work-list" id="worklist"></div>
  </div>

  <div class="center">
    <div class="toolbar" id="toolbar">
      <button id="btnEdit" onclick="doEdit()" disabled>Edit</button>
      <button id="btnSave" onclick="doSave()" class="primary" disabled>Save</button>
      <button id="btnCancel" onclick="doCancel()" class="danger" disabled>Cancel</button>
      <div class="sep"></div>
      <button id="btnHistory" onclick="toggleHistory()" disabled>History</button>
      <button id="btnLinks" onclick="toggleLinks()" disabled>Links</button>
      <span class="rev-info" id="revInfo"></span>
    </div>
    <div class="presence-bar" id="presenceBar" style="display:none">
      <span class="label">Editors</span>
      <div id="presenceUsers"></div>
    </div>
    <div class="revision-slider" id="revSlider">
      <label>Revision</label>
      <input type="range" id="revRange" min="0" max="0" value="0" oninput="onRevSlide(this.value)">
      <span class="rev-num" id="revNum">0</span>
      <button onclick="closeHistory()">Back to current</button>
      <button id="btnRestore" onclick="doRestore()" style="display:none;margin-left:4px;background:#d29922;color:#0d1117;font-weight:600">Restore this version</button>
    </div>
    <div class="editor-area">
      <div class="editor-content" id="editor"></div>
    </div>
  </div>

  <div class="right-panel" id="rightPanel" style="display:none">
    <div class="panel-header"><h2>Links</h2></div>
    <div class="link-list" id="linklist"></div>
    <div class="color-legend">
      <h3>Author Colors</h3>
      <div id="legendItems"></div>
    </div>
  </div>
</div>

<div class="footer">
  <input id="cmd" placeholder="Type a command..." autofocus>
  <button onclick="sendCmd()">Run</button>
</div>
<div class="toast" id="toast"></div>

<script>
const AUTHOR_COLORS = [
  '#58a6ff','#3fb950','#d29922','#f85149','#bc8cff',
  '#39d353','#79c0ff','#ffa657','#ff7b72','#d2a8ff',
  '#56d4dd','#7ee787','#e3b341','#ffa198','#b392f0'
];

let ws=null, nextId=1, sessionId=null, loggedIn=false;
let works=[], currentWork=null, currentRev=0, totalRevs=0;
let isEditing=false, viewingHistory=false;
let subscriptions={};
let presence={};
let authorColors={};
let authorMap={};
let colorIdx=0;
let pendingReq={};
let lastKnownText='';
let historyText=null;
let historyRev=null;
let autoSaveTimer=null;
const AUTO_SAVE_MS=1500;

const $=id=>document.getElementById(id);

function getAuthorColor(sessionId) {
  if (!authorColors[sessionId]) {
    authorColors[sessionId] = AUTHOR_COLORS[colorIdx % AUTHOR_COLORS.length];
    colorIdx++;
  }
  return authorColors[sessionId];
}

function getAuthorName(sid) {
  if (sid === sessionId) return 'You';
  if (authorMap[sid]) return authorMap[sid];
  return 'User ' + sid;
}

function toast(msg) {
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function connectWs() {
  const proto = location.protocol==='https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto+'//'+location.host+'/xudanu?format=json&version=2');
  ws.onopen = () => { $('status').textContent='Connected'; $('status').className='status connected'; };
  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    console.log('msg', msg.type, msg);
    if (msg.type==='handshake') { doConnect(); return; }
    if (msg.type==='response') { handleResp(msg); return; }
    if (msg.type==='event') { handleEvent(msg); return; }
    if (msg.type==='error') { console.error('error', msg); toast((msg.message||msg.code).replace(/^Error:\s*/,'')); return; }
  };
  ws.onclose = () => { $('status').textContent='Disconnected'; $('status').className='status'; };
  ws.onerror = () => { $('status').textContent='Error'; $('status').className='status'; };
}

function req(op, payload) {
  const id = nextId++;
  const f = {v:2, type:'request', id, op};
  if (payload) f.payload = payload;
  pendingReq[id] = op;
  ws.send(JSON.stringify(f));
  return id;
}

function subscribe(detType, targetId) {
  const id = nextId++;
  const f = {v:2, type:'subscribe', id, payload:{detector_type:detType, target_id:targetId}};
  ws.send(JSON.stringify(f));
  return id;
}

function unsubscribe(subId) {
  const f = {v:2, type:'unsubscribe', id:subId};
  ws.send(JSON.stringify(f));
}

function doConnect() { req('session_connect'); }

function handleResp(msg) {
  const op = pendingReq[msg.id];
  delete pendingReq[msg.id];
  const v = msg.value;
  console.log('resp', op, JSON.stringify(v));

  if (op==='session_connect' && v && (v.type==='humber' || v.type==='id')) {
    sessionId = v.value;
    $('sessionInfo').textContent = 'session '+sessionId;
    req('session_login_public');
    return;
  }
  if (op==='session_login_public') {
    loggedIn=true;
    $('btnNew').disabled=false;
    refresh(); return;
  }

  if (v && v.type==='work_list') {
    works = v.value;
    renderWorkList();
    return;
  }
  if (v && v.type==='edition') {
    if (op==='work_revise_delta') {
      let text = '';
      const ed = v.value;
      if (ed && ed.text) text = ed.text;
      else if (ed && ed.entries) text = ed.entries.map(e => e[1].Text ? e[1].Text.text : '').join('');
      $('editor').textContent = text;
      lastKnownText = text;
      currentRev = totalRevs;
      toast('Conflict resolved - document updated');
      updateRevInfo();
      return;
    }
    renderEdition(v.value, op==='work_fetch_revision');
    return;
  }
  if (op==='work_create') {
    const workId = (v && v.type==='id') ? v.value : (v && v.type==='humber') ? v.value : null;
    if (workId !== null) {
      currentWork = workId; currentRev=0; totalRevs=1; isEditing=false;
      refresh(); showWork(currentWork);
      toast('Document created');
      return;
    }
  }
  if (v && v.type==='humber') {
    if (op==='work_revise') {
      currentRev = v.value; totalRevs = v.value;
      if (restoringAfterGrab === 'revising') {
        restoringAfterGrab = false;
        req('work_release', {work_id: currentWork});
        closeHistory();
        toast('Restored revision as #'+v.value);
      } else {
        isEditing=false;
        updateToolbar();
        toast('Saved revision '+v.value);
      }
      return;
    }
    if (op==='work_revise_delta') {
      currentRev = v.value; totalRevs = v.value;
      updateRevInfo();
      toast('Auto-saved revision '+v.value);
      return;
    }
    if (op==='work_revision_count') {
      totalRevs = v.value;
      if (!isEditing) currentRev = v.value;
      updateRevInfo();
      return;
    }
  }
  if (v && v.type==='link_list') { renderLinks(v.value); return; }
  if ((v && v.type==='boolean' && v.value===true && op==='work_grab') ||
      (v && v.type==='void' && op==='work_grab')) {
    if (restoringAfterGrab === true) {
      restoringAfterGrab = false;
      finishRestore();
    } else {
      isEditing=true; updateToolbar();
      $('editor').contentEditable='true'; $('editor').focus();
      toast('Editing - type your changes');
    }
    return;
  }
  if (v && v.type==='void' && op==='work_release') {
    isEditing=false; updateToolbar();
    $('editor').contentEditable='false';
    return;
  }
}

function handleEvent(msg) {
  const ev = msg.event;
  if (!ev) return;

  if (ev.type==='work_revised') {
    if (ev.payload.work_be_id === currentWork && !isEditing && !viewingHistory) {
      currentRev = ev.payload.revision;
      totalRevs = ev.payload.revision;
      req('work_get_edition', {work_id: currentWork});
      updateRevInfo();
    } else if (ev.payload.work_be_id === currentWork) {
      totalRevs = ev.payload.revision;
      updateRevInfo();
    }
    if (ev.payload.session_id) {
      const sid = ev.payload.session_id;
      if (sid !== sessionId) {
        const color = getAuthorColor(sid);
        authorMap[sid] = authorMap[sid] || ('User '+sid);
        toast(getAuthorName(sid)+' saved revision '+ev.payload.revision);
      }
    }
  }
  if (ev.type==='work_grabbed' && ev.payload.work_be_id === currentWork) {
    const sid = ev.payload.session_id;
    if (sid !== sessionId) {
      presence[sid] = {editing: true};
      updatePresence();
      toast(getAuthorName(sid)+' started editing');
    }
  }
  if (ev.type==='work_released' && ev.payload.work_be_id === currentWork) {
    const sid = ev.payload.session_id;
    if (sid !== sessionId) {
      delete presence[sid];
      updatePresence();
    }
  }
}

function refresh() {
  req('work_list');
  if (currentWork) req('link_list_for_work', {work_id: currentWork});
}

function showWork(id) {
  Object.values(subscriptions).forEach(subId => unsubscribe(subId));
  subscriptions = {};
  presence = {};

  currentWork = id; isEditing=false; viewingHistory=false;
  $('editor').contentEditable='false';
  closeHistory();

  const s1 = subscribe('revision', id);
  const s2 = subscribe('status', id);
  subscriptions = {revision: s1, status: s2};

  req('work_get_edition', {work_id: id});
  req('link_list_for_work', {work_id: id});
  req('work_revision_count', {work_id: id});
  updateToolbar();
}

function renderWorkList() {
  const el = $('worklist'); el.innerHTML='';
  if (!works.length) { el.innerHTML='<div style="padding:12px;color:var(--fg3);font-size:12px">No documents yet</div>'; return; }
  for (const w of works) {
    const d = document.createElement('div');
    d.className = 'work-item'+(w.work_id===currentWork?' active':'');
    let badge = '';
    if (w.is_grabbed) badge = '<span class="badge badge-editing">editing</span>';
    d.innerHTML = '<span class="id">'+w.work_id+'</span><span class="meta">'+badge+'</span><span class="rev">r'+w.revision_count+'</span>';
    d.onclick = () => { currentWork=w.work_id; currentRev=w.revision_count; totalRevs=w.revision_count; showWork(w.work_id); };
    el.appendChild(d);
  }
}

function renderEdition(ed, isHistoryView) {
  const el = $('editor');
  if (!ed || ed.empty!==undefined) {
    el.innerHTML = '<span class="placeholder-text">Empty document</span>';
    updateLegend();
    return;
  }
  let text = '';
  if (ed.text) text = ed.text;
  else if (ed.entries) text = ed.entries.map(e => {
    const el = e[1];
    return el.Text ? el.Text.text : '['+JSON.stringify(el)+']';
  }).join('');
  else text = JSON.stringify(ed);

  if (isHistoryView) {
    historyText = text;
    el.innerHTML = '';
    const span = document.createElement('span');
    span.style.opacity = '0.6';
    span.textContent = text;
    el.appendChild(span);
  } else {
    historyText = null;
    historyRev = null;
    el.textContent = text;
    if (isEditing) lastKnownText = text;
  }
  updateLegend();
}

function renderLinks(links) {
  const el = $('linklist'); el.innerHTML='';
  if (!links||!links.length) { el.innerHTML='<div style="padding:12px;color:var(--fg3);font-size:12px">No links</div>'; return; }
  for (const l of links) {
    const d = document.createElement('div'); d.className='link-item';
    const other = l.origin===currentWork ? l.destination : l.origin;
    d.innerHTML = '<span class="id">'+l.link_id+'</span> <span class="arrow">&rarr;</span> <span class="id">'+other+'</span>';
    d.onclick = () => { currentWork=other; showWork(other); refresh(); };
    el.appendChild(d);
  }
}

function updatePresence() {
  const bar = $('presenceBar');
  const users = $('presenceUsers');
  const keys = Object.keys(presence);
  if (!keys.length && !isEditing) { bar.style.display='none'; return; }
  bar.style.display='flex';
  users.innerHTML = '';
  if (isEditing) {
    const s = document.createElement('span');
    s.className = 'presence-user';
    s.style.background = getAuthorColor(sessionId)+'22';
    s.style.color = getAuthorColor(sessionId);
    s.textContent = 'You (editing)';
    users.appendChild(s);
  }
  for (const sid of keys) {
    const s = document.createElement('span');
    s.className = 'presence-user';
    const c = getAuthorColor(parseInt(sid));
    s.style.background = c+'22';
    s.style.color = c;
    s.textContent = getAuthorName(parseInt(sid)) + (presence[sid].editing ? ' (editing)' : '');
    users.appendChild(s);
  }
  updateLegend();
}

function updateLegend() {
  const el = $('legendItems'); el.innerHTML='';
  if (!Object.keys(authorMap).length && !sessionId) return;
  const me = document.createElement('div'); me.className='legend-item';
  me.innerHTML = '<span class="legend-swatch" style="background:'+getAuthorColor(sessionId)+'"></span>You';
  el.appendChild(me);
  for (const [sid, name] of Object.entries(authorMap)) {
    const d = document.createElement('div'); d.className='legend-item';
    d.innerHTML = '<span class="legend-swatch" style="background:'+getAuthorColor(parseInt(sid))+'"></span>'+name;
    el.appendChild(d);
  }
}

function updateToolbar() {
  $('btnEdit').disabled = !currentWork || isEditing;
  $('btnSave').disabled = !isEditing;
  $('btnCancel').disabled = !isEditing;
  $('btnHistory').disabled = !currentWork || isEditing;
  $('btnLinks').disabled = !currentWork;
  updateRevInfo();
  updatePresence();
}

function updateRevInfo() {
  const info = $('revInfo');
  if (!currentWork) { info.innerHTML=''; return; }
  let html = '<span>rev '+currentRev+'/'+totalRevs+'</span>';
  if (isEditing) html += ' <span class="editing">EDITING</span>';
  info.innerHTML = html;
  const range = $('revRange');
  range.max = totalRevs;
  range.value = currentRev;
  $('revNum').textContent = currentRev;
}

function doCreate() {
  const text = prompt('New document text:');
  if (text === null) return;
  req('work_create', {edition:{text: text||''}});
}

function doEdit() {
  if (!currentWork) return;
  lastKnownText = $('editor').textContent;
  req('work_grab', {work_id: currentWork});
}

function doSave() {
  if (!currentWork) return;
  if (autoSaveTimer) { clearTimeout(autoSaveTimer); autoSaveTimer=null; }
  const text = $('editor').textContent;
  if (text === lastKnownText) {
    req('work_release', {work_id: currentWork});
    $('editor').contentEditable='false';
    isEditing=false;
    updateToolbar();
    return;
  }
  const ops = computeDelta(lastKnownText, text);
  req('work_revise_delta', {work_id: currentWork, base_revision: currentRev, ops});
  lastKnownText = text;
  $('editor').contentEditable='false';
}

function doCancel() {
  if (!currentWork) return;
  if (autoSaveTimer) { clearTimeout(autoSaveTimer); autoSaveTimer=null; }
  req('work_release', {work_id: currentWork});
  $('editor').textContent = lastKnownText;
  $('editor').contentEditable='false';
  isEditing=false;
  updateToolbar();
}

function scheduleAutoSave() {
  if (autoSaveTimer) clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => {
    if (!isEditing || !currentWork) return;
    const text = $('editor').textContent;
    if (text === lastKnownText) return;
    const ops = computeDelta(lastKnownText, text);
    req('work_revise_delta', {work_id: currentWork, base_revision: currentRev, ops});
    lastKnownText = text;
  }, AUTO_SAVE_MS);
}

function computeDelta(oldText, newText) {
  const ops = [];
  let oi = 0, ni = 0;
  const ol = oldText.length, nl = newText.length;
  while (oi < ol || ni < nl) {
    let commonLen = 0;
    const maxCommon = Math.min(ol - oi, nl - ni);
    while (commonLen < maxCommon && oldText.charCodeAt(oi + commonLen) === newText.charCodeAt(ni + commonLen)) {
      commonLen++;
    }
    if (commonLen > 0) {
      ops.push({type:'retain', count:commonLen});
      oi += commonLen;
      ni += commonLen;
    }
    let deleteLen = 0;
    while (oi + deleteLen < ol && (ni >= nl || oldText.charCodeAt(oi + deleteLen) !== newText.charCodeAt(ni))) {
      deleteLen++;
    }
    if (deleteLen > 0) {
      ops.push({type:'delete', count:deleteLen});
      oi += deleteLen;
    }
    let insertLen = 0;
    while (ni + insertLen < nl && (oi >= ol || oldText.charCodeAt(oi) !== newText.charCodeAt(ni + insertLen))) {
      insertLen++;
    }
    if (insertLen > 0) {
      ops.push({type:'insert', text: newText.substring(ni, ni + insertLen)});
      ni += insertLen;
    }
  }
  return ops;
}

function toggleHistory() {
  const slider = $('revSlider');
  if (slider.classList.contains('visible')) { closeHistory(); return; }
  slider.classList.add('visible');
  viewingHistory = true;
  $('revRange').max = totalRevs;
  $('revRange').value = totalRevs;
  $('revNum').textContent = totalRevs;
}

function closeHistory() {
  $('revSlider').classList.remove('visible');
  $('btnRestore').style.display = 'none';
  viewingHistory = false;
  historyText = null;
  historyRev = null;
  if (currentWork) req('work_get_edition', {work_id: currentWork});
}

function onRevSlide(val) {
  $('revNum').textContent = val;
  historyRev = parseInt(val);
  $('btnRestore').style.display = (historyRev < totalRevs) ? '' : 'none';
  req('work_fetch_revision', {work_id: currentWork, number: parseInt(val)});
}

function doRestore() {
  if (!currentWork || historyText === null) return;
  if (!confirm('Restore document to revision ' + historyRev + '? This will create a new revision with that content.')) return;
  req('work_grab', {work_id: currentWork});
  restoringAfterGrab = true;
}

var restoringAfterGrab = false;

function finishRestore() {
  req('work_revise', {work_id: currentWork, edition: {text: historyText}});
  restoringAfterGrab = 'revising';
}

function toggleLinks() {
  const p = $('rightPanel');
  p.style.display = p.style.display==='none' ? 'flex' : 'none';
}

function sendCmd() {
  const text = $('cmd').value.trim();
  if (!text) return;
  $('cmd').value = '';
  const parts = text.split(/\s+/), c = parts[0].toLowerCase(), a = parts.slice(1);
  switch(c) {
    case 'create': req('work_create',{edition:{text:a.join(' ')||''}}); break;
    case 'list': req('work_list'); break;
    case 'open': if(a[0]) { currentWork=parseInt(a[0]); showWork(currentWork); refresh(); } break;
    case 'grab': req('work_grab',{work_id:+a[0]}); break;
    case 'revise': req('work_revise',{work_id:+a[0],edition:{text:a.slice(1).join(' ')||''}}); break;
    case 'release': req('work_release',{work_id:+a[0]}); break;
    case 'link': req('link_create',{origin:+a[0],destination:+a[1]}); break;
    case 'links': req('link_list_for_work',{work_id:+a[0]}); break;
    case 'club': if(a[0]) req('club_create_named',{name:a[0],description:{text:'club'}}); break;
    case 'info': req('server_stats'); break;
    case 'help':
      toast('Commands: create <text>, list, open <id>, grab <id>, revise <id> <text>, release <id>, link <from> <to>, links <id>, club <name>, info');
      break;
    default: toast('Unknown: '+c);
  }
}

$('cmd').addEventListener('keydown', e => { if(e.key==='Enter') sendCmd(); });
$('editor').addEventListener('input', () => { if(isEditing) scheduleAutoSave(); });
connectWs();
</script>
</body>
</html>
