[package]
name = "xudanu"
version = "1.0.2"
edition = "2021"
license = "Apache-2.0"
authors = ["David Jones <david@dgjones.info>"]
description = "Hypertext document store with collaborative CRDT editing"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "xudanu-server"
required-features = ["server"]

[[bin]]
name = "xudanu-cli"
required-features = ["server"]

[features]
default = []
wasm = ["wasm-bindgen", "console_error_panic_hook", "serde", "serde_json", "js-sys"]
server = ["tokio", "axum", "postcard", "tracing", "tracing-subscriber", "tracing-appender", "serde", "serde_json", "futures-util", "tokio-tungstenite", "chacha20poly1305", "x25519-dalek", "ed25519-dalek", "sha2", "hmac", "hkdf", "argon2", "subtle", "rand", "zeroize", "mime_guess", "axum-server", "rustls-pemfile", "rustls", "ring", "base64", "reqwest", "oauth2", "webpki-roots", "hex", "epub", "cli-epub-to-text", "image", "oxipng"]
heif = ["libheif-rs"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dependencies]
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
js-sys = { version = "0.3", optional = true }
bitflags = "2"
tokio = { version = "1", features = ["full"], optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
postcard = { version = "1", features = ["alloc"], optional = true }
tracing = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
tracing-appender = { version = "0.2", optional = true }
tokio-tungstenite = { version = "0.29", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
x25519-dalek = { version = "2.0", features = ["static_secrets"], optional = true }
ed25519-dalek = { version = "2.1", features = ["rand_core"], optional = true }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
hkdf = { version = "0.12", optional = true }
argon2 = { version = "0.5", optional = true }
subtle = { version = "2.5", optional = true }
rand = { version = "0.8", optional = true }
zeroize = { version = "1.8", features = ["derive"], optional = true }
mime_guess = { version = "2.0.5", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }
rustls = { version = "0.23", optional = true, features = ["ring", "std", "tls12"] }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
ring = { version = "0.17", optional = true }
base64 = { version = "0.22", optional = true }
reqwest = { version = "0.12", features = ["rustls-tls", "json", "blocking"], default-features = false, optional = true }
oauth2 = { version = "5", optional = true }
webpki-roots = { version = "0.26", optional = true }
hex = { version = "0.4", optional = true }
epub = { version = "2.1", optional = true }
cli-epub-to-text = { version = "0.1", optional = true }
image = { version = "0.25", optional = true }
oxipng = { version = "9", optional = true, default-features = false }
libheif-rs = { version = "2", optional = true, features = ["image"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["__rustls-tls"] }
 futures-util = "0.3"
serde_json = "1"
proptest = "1"
tempfile = "3"
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
axum-server = { version = "0.7", features = ["tls-rustls"] }
axum = { version = "0.8", features = ["ws"] }
ring = "0.17"
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }

[[test]]
name = "integration"
required-features = ["server"]

[[test]]
name = "tls"
required-features = ["server"]

[[bench]]
name = "dispatch_bench"
harness = false
required-features = ["server"]
