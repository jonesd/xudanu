[package]
name = "xudanu"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "xudanu-server"
required-features = ["server"]

[[bin]]
name = "xudanu-cli"
required-features = ["server"]

[features]
default = []
wasm = ["wasm-bindgen", "console_error_panic_hook", "serde", "serde_json", "js-sys"]
server = ["tokio", "axum", "postcard", "tracing", "tracing-subscriber", "tracing-appender", "serde", "serde_json", "futures-util", "tokio-tungstenite", "chacha20poly1305", "x25519-dalek", "ed25519-dalek", "sha2", "hmac", "hkdf", "argon2", "subtle", "rand", "zeroize", "mime_guess", "axum-server", "rustls-pemfile", "rustls", "ring", "yrs", "base64"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dependencies]
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
js-sys = { version = "0.3", optional = true }
bitflags = "2"
tokio = { version = "1", features = ["full"], optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
postcard = { version = "1", features = ["alloc"], optional = true }
tracing = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
tracing-appender = { version = "0.2", optional = true }
tokio-tungstenite = { version = "0.29", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
x25519-dalek = { version = "2.0", features = ["static_secrets"], optional = true }
ed25519-dalek = { version = "2.1", features = ["rand_core"], optional = true }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
hkdf = { version = "0.12", optional = true }
argon2 = { version = "0.5", optional = true }
subtle = { version = "2.5", optional = true }
rand = { version = "0.8", optional = true }
zeroize = { version = "1.8", features = ["derive"], optional = true }
mime_guess = { version = "2.0.5", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }
rustls = { version = "0.23", optional = true, features = ["ring", "std", "tls12"] }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
ring = { version = "0.17", optional = true }
yrs = { version = "0.25", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["__rustls-tls"] }
futures-util = "0.3"
serde_json = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
proptest = "1"
tempfile = "3"
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
axum-server = { version = "0.7", features = ["tls-rustls"] }
axum = { version = "0.8", features = ["ws"] }
ring = "0.17"

[[test]]
name = "integration"
required-features = ["server"]

[[test]]
name = "tls"
required-features = ["server"]
