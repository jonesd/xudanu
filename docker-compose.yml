# 3-node cross-server test bed on a private bridge network.
#
# Each container serves the full web UI + API + WebSocket.
# Host ports 8081/8082/8083 let you browse each node.
#
# Cross-server content links (FR-6) work between nodes:
#   - Each node has /api/public/work/{id} for public content
#   - Each node has /.well-known/xudanu-server.json
#   - --public-address sets the tumbler domain for cross-server refs
#
# To test cross-server:
#   1. Open http://localhost:8081 — create a work, publish it
#   2. Open http://localhost:8082 — create a cross-server link to peer1's work
#   3. The link uses tumbler "localhost:8081".0x{id}.1.0.0 with BLAKE3 hash

services:
  node1:
    build: .
    image: xudanu:latest
    container_name: xudanu-node1
    hostname: node1
    networks: [xudanu-net]
    ports: ["8081:8080"]
    volumes: ["node1-data:/data"]
    command:
      - run
      - "0.0.0.0:8080"
      - /data
      - --static-dir
      - /app/dist
      - --public-address
      - "localhost:8081"
      - --server-name
      - "Node Alpha"
      - --server-description
      - "Test node 1 — cross-server link source"
      - --allowed-origin
      - "http://localhost:8081"
      - --allowed-origin
      - "http://localhost:8082"
      - --allowed-origin
      - "http://localhost:8083"

  node2:
    build: .
    image: xudanu:latest
    container_name: xudanu-node2
    hostname: node2
    networks: [xudanu-net]
    ports: ["8082:8080"]
    volumes: ["node2-data:/data"]
    command:
      - run
      - "0.0.0.0:8080"
      - /data
      - --static-dir
      - /app/dist
      - --public-address
      - "localhost:8082"
      - --server-name
      - "Node Beta"
      - --server-description
      - "Test node 2 — cross-server link target"
      - --allowed-origin
      - "http://localhost:8081"
      - --allowed-origin
      - "http://localhost:8082"
      - --allowed-origin
      - "http://localhost:8083"

  node3:
    build: .
    image: xudanu:latest
    container_name: xudanu-node3
    hostname: node3
    networks: [xudanu-net]
    ports: ["8083:8080"]
    volumes: ["node3-data:/data"]
    command:
      - run
      - "0.0.0.0:8080"
      - /data
      - --static-dir
      - /app/dist
      - --public-address
      - "localhost:8083"
      - --server-name
      - "Node Gamma"
      - --server-description
      - "Test node 3 — cross-server trail relay"
      - --allowed-origin
      - "http://localhost:8081"
      - --allowed-origin
      - "http://localhost:8082"
      - --allowed-origin
      - "http://localhost:8083"

networks:
  xudanu-net:
    driver: bridge

volumes:
  node1-data:
  node2-data:
  node3-data:
