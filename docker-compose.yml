# docker-compose.yml — 3-node Xudanu cross-server demo
#
# Each node is an independent server with its own identity, data, and
# keypair. They discover each other via /.well-known/xudanu-server.json
# and resolve cross-server references via the public content API.
#
# Usage:
#   docker compose up --build
#
# Then open in your browser:
#   http://localhost:8081  — Alice's server
#   http://localhost:8082  — Bob's server
#   http://localhost:8083  — Carol's server
#
# Cross-server flow:
#   1. On Alice (8081): create account, create a work, write content
#   2. On Bob (8082): create account, add Alice's server to directory
#      (http://localhost:8081), create a cross-server link to Alice's work
#   3. Bob's server fetches Alice's content, verifies BLAKE3 hash,
#      caches it locally. A backlink notification goes to Alice.
#   4. On Alice (8081): check Connections panel — Bob's link appears
#
# To reset all data:
#   docker compose down -v

services:
  alice:
    build:
      context: .
      dockerfile: Dockerfile
    image: xudanu:latest
    container_name: xudanu-alice
    hostname: alice
    ports:
      - "8081:8080"
    volumes:
      - alice-data:/data
    command:
      - run
      - "0.0.0.0:8080"
      - /data
      - --static-dir
      - /app/dist
      - --public-address
      - "localhost:8081"
      - --server-name
      - "Alice"
      - --server-description
      - "Alice's server — content publisher"
      - --allowed-origin
      - "http://localhost:8081"
      - --allowed-origin
      - "http://localhost:8082"
      - --allowed-origin
      - "http://localhost:8083"
    networks:
      xudanu-net:
        aliases:
          - alice

  bob:
    build:
      context: .
      dockerfile: Dockerfile
    image: xudanu:latest
    container_name: xudanu-bob
    hostname: bob
    ports:
      - "8082:8080"
    volumes:
      - bob-data:/data
    command:
      - run
      - "0.0.0.0:8080"
      - /data
      - --static-dir
      - /app/dist
      - --public-address
      - "localhost:8082"
      - --server-name
      - "Bob"
      - --server-description
      - "Bob's server — commentator and transcluder"
      - --allowed-origin
      - "http://localhost:8081"
      - --allowed-origin
      - "http://localhost:8082"
      - --allowed-origin
      - "http://localhost:8083"
    networks:
      xudanu-net:
        aliases:
          - bob

  carol:
    build:
      context: .
      dockerfile: Dockerfile
    image: xudanu:latest
    container_name: xudanu-carol
    hostname: carol
    ports:
      - "8083:8080"
    volumes:
      - carol-data:/data
    command:
      - run
      - "0.0.0.0:8080"
      - /data
      - --static-dir
      - /app/dist
      - --public-address
      - "localhost:8083"
      - --server-name
      - "Carol"
      - --server-description
      - "Carol's server — newcomer, discovers and transcludes"
      - --allowed-origin
      - "http://localhost:8081"
      - --allowed-origin
      - "http://localhost:8082"
      - --allowed-origin
      - "http://localhost:8083"
    networks:
      xudanu-net:
        aliases:
          - carol

networks:
  xudanu-net:
    driver: bridge

volumes:
  alice-data:
  bob-data:
  carol-data:
