# docker-compose.yml — 4-node Xudanu federation test network
#
# 4 nodes = the minimum for BFT governance (f=1, quorum 3 of 4).
# 3 nodes CANNOT do Byzantine fault tolerance (needs 3f+1 = 4) — the
# governance plane refuses to open rounds below 4 members.
#
# All nodes are wired as federation peers (--peer flags): the dialer
# maintains /federation WebSocket connections, membership joins via
# the endorsement handshake, and governance (PBFT) runs over the mesh.
#
# Usage:
#   docker compose up --build
#
# Then from any node (or your host):
#   curl http://localhost:8081/.well-known/xudanu-server.json
#   curl http://localhost:8081/health   # see "governance_lifecycle"
#
# Genesis pinning (strict peer admission): generate member keys,
# write a JSON PinnedMember list, and add
#   --pin-members /data/pinned-members.json
# to each node's command (mount the file into /data via the volume).

x-node: &node
  build:
    context: ..
    dockerfile: Dockerfile

# Admin passphrases: set via env var (never CLI — visible in `ps`
# and `docker inspect` process args). Put values in an uncommitted
# .env file next to this compose file:
#   echo "NODE1_ADMIN_PASSPHRASE=$(openssl rand -hex 24)" >> .env
#   echo "NODE2_ADMIN_PASSPHRASE=$(openssl rand -hex 24)" >> .env
#   ...
# Fail-closed: a node WITHOUT a passphrase cannot be admin-logged-in
# at all (the admin club's lock becomes an unopenable WallLock), so
# a demo can deliberately expose admin on node 1 only.
#
# Security notes for this test bed:
#   - Published ports bind to 127.0.0.1 only: the nodes are reachable
#     from this machine, not the LAN. Inter-node federation traffic
#     uses the internal bridge network (node1:8080 etc.), not the
#     published ports, so the mesh is unaffected.
#   - No --pin-members by default: peer admission is endorsement-based
#     (min 2). For a persistent cluster, generate pinned-members.json
#     (scripts/federation.sh does this for you) and add --pin-members.
services:
  node1:
    <<: *node
    environment:
      - XUDANU_ADMIN_PASSPHRASE=${NODE1_ADMIN_PASSPHRASE:-}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - node1-data:/data
    command:
      - "run"
      - "0.0.0.0:8080"
      - "/data"
      - "--static-dir"
      - "/app/dist"
      - "--server-name"
      - "Node 1 (Alice)"
      - "--server-description"
      - "First federation node"
      - "--server-namespace-id"
      - "1"
      - "--peer"
      - "node2:8080"
      - "--peer"
      - "node3:8080"
      - "--peer"
      - "node4:8080"
    networks:
      xudanu-net:
        aliases:
          - node1

  node2:
    <<: *node
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - node2-data:/data
    command:
      - "run"
      - "0.0.0.0:8080"
      - "/data"
      - "--static-dir"
      - "/app/dist"
      - "--server-name"
      - "Node 2 (Bob)"
      - "--server-description"
      - "Second federation node"
      - "--server-namespace-id"
      - "2"
      - "--peer"
      - "node1:8080"
      - "--peer"
      - "node3:8080"
      - "--peer"
      - "node4:8080"
    networks:
      xudanu-net:
        aliases:
          - node2

  node3:
    <<: *node
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - node3-data:/data
    command:
      - "run"
      - "0.0.0.0:8080"
      - "/data"
      - "--static-dir"
      - "/app/dist"
      - "--server-name"
      - "Node 3 (Carol)"
      - "--server-description"
      - "Third federation node"
      - "--server-namespace-id"
      - "3"
      - "--peer"
      - "node1:8080"
      - "--peer"
      - "node2:8080"
      - "--peer"
      - "node4:8080"
    networks:
      xudanu-net:
        aliases:
          - node3

  node4:
    <<: *node
    ports:
      - "127.0.0.1:8084:8080"
    volumes:
      - node4-data:/data
    command:
      - "run"
      - "0.0.0.0:8080"
      - "/data"
      - "--static-dir"
      - "/app/dist"
      - "--server-name"
      - "Node 4 (Dave)"
      - "--server-description"
      - "Fourth federation node (BFT minimum)"
      - "--server-namespace-id"
      - "4"
      - "--peer"
      - "node1:8080"
      - "--peer"
      - "node2:8080"
      - "--peer"
      - "node3:8080"
    networks:
      xudanu-net:
        aliases:
          - node4

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:

networks:
  xudanu-net:
    driver: bridge
